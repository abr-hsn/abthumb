name: Bug report
description: Report a rendering issue, crash, blank thumbnail, or installer problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security vulnerabilities, please use **Security → Report a vulnerability** instead of a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly (e.g., blank thumbnail, wrong colors, slow render, preview pane issue).
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File format
      options:
        - Adobe Illustrator (.ai / .ait)
        - Adobe Photoshop (.psd / .psdt / .pdd)
        - Photoshop Large Document (.psb)
        - Encapsulated PostScript (.eps / .epsf / .epsi)
        - PDF (.pdf)
        - Installer / Explorer integration
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: abthumb version
      placeholder: e.g. 0.1.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version & build
      placeholder: e.g. Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic output (optional)
      description: Paste output from `abthumb status`, `abthumb stats`, or `abthumb render <file> --size 256` if available.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: File privacy check
      options:
        - label: If attaching a sample file, I confirm it does not contain private/confidential client data.
