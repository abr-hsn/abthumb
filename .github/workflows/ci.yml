name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium binaries (pinned by SHA-256 in cmake/pdfium.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/pdfium
          key: pdfium-${{ hashFiles('cmake/pdfium.cmake') }}

      - name: Build (release)
        shell: cmd
        run: build.cmd release

      - name: Unit tests
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\build\release\bin\abt_tests.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: abthumb-x64-unsigned
          path: |
            build/release/bin/*.exe
            build/release/bin/*.dll
          retention-days: 14

  quality:
    # Static checks (D-035): /W4 /WX build, clang-format (advisory), cppcheck, clang-tidy, MSVC /analyze.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # clang-format checks the files changed against origin/main

      - name: Cache PDFium binaries (pinned by SHA-256 in cmake/pdfium.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/pdfium
          key: pdfium-${{ hashFiles('cmake/pdfium.cmake') }}

      - name: Install cppcheck
        shell: pwsh
        run: choco install cppcheck -y --no-progress

      - name: Quality gates
        shell: pwsh
        # clang-format / clang-tidy come with Visual Studio's LLVM component. regress.ps1 needs local design files
        # and the fuzz run is the next job, so both are skipped here.
        run: |
          $env:PATH = "$env:ProgramFiles\cppcheck;$env:PATH"
          ./scripts/ci.ps1 -NoRegress -FuzzSeconds 0

  fuzz-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Build fuzzers (libFuzzer + ASan)
        shell: cmd
        run: build.cmd fuzz

      - name: Run each fuzzer for 60 s
        shell: pwsh
        run: |
          # The ASan runtime must come from the same MSVC toolset that built the fuzzers.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $bin = "$vs\VC\Tools\MSVC\$ver\bin\Hostx64\x64"
          if (-not (Test-Path "$bin\clang_rt.asan_dynamic-x86_64.dll")) { throw "ASan runtime not found in $bin" }
          $env:PATH = "$bin;$env:PATH"
          New-Item -ItemType Directory -Force build\fuzz\art | Out-Null
          foreach ($t in "probe", "psd", "qoi") {
            New-Item -ItemType Directory -Force "build\fuzz\corp\$t" | Out-Null
            & "build\fuzz\bin\fuzz_$t.exe" -max_total_time=60 -max_len=262144 -timeout=10 -rss_limit_mb=2048 `
              -print_final_stats=1 "-artifact_prefix=build\fuzz\art\${t}_" "build\fuzz\corp\$t" 2>&1 | Out-Host
            if ($LASTEXITCODE) { throw "fuzz_$t failed (exit $LASTEXITCODE), see the output above" }
          }

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/art
